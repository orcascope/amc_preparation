bundle:
  name: amc-prep

variables:
  lakebase_endpoint:
    description: Lakebase endpoint the app gets tokens for
  database_url:
    description: Lakebase url to connect to

resources:
  apps:
    amc_prep:
      name: amc-prep-${bundle.target}        # amc-prep-dev / amc-prep-prod
      source_code_path: .
      config:
        command: ["python", "-m", "app.run"]
        env:
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}
          - name: DATABASE_URL
            value: ${var.database_url}            

targets:
  dev:
    mode: development
    default: true
    variables:
      lakebase_endpoint: projects/hobby/branches/dev/endpoints/primary
      database_url: 'postgresql://ars.1001%40gmail.com@ep-orange-glitter-d8rpfph8.database.us-east-2.cloud.databricks.com/databricks_postgres?sslmode=require'

  prod:
    mode: production
    variables:
      lakebase_endpoint: projects/hobby/branches/production/endpoints/primary
      database_url: 'postgresql://ars.1001%40gmail.com@ep-orange-glitter-d8rpfph8.database.us-east-2.cloud.databricks.com/databricks_postgres?sslmode=require'


sync:
  exclude:
    # Python
    - '__pycache__/'
    - '*.pyc'
    - 'venv/'
    - '.venv/'

    # Local HTTPS certificate — contains a private key, never commit it
    - 'app/certs/'

    # Local database (per-machine student progress)
    - 'app/data/*.db'
    - 'app/data/*.db-journal'

    - 'amc_questions/*/questions'
    - 'amc_questions/*/solutions'

    # Editor/OS noise
    - .DS_Store
    - Thumbs.db
    - .env
    - __pycache__/

    - '.claude/*'
    - 'tools/'